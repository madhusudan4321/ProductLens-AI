# ProductLens AI — Frontend Deployment
# Placeholder — will be fully configured in Phase 10
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: productlens
  labels:
    app: productlens
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productlens
      component: frontend
  template:
    metadata:
      labels:
        app: productlens
        component: frontend
    spec:
      containers:
        - name: frontend
          image: productlens/frontend:latest  # TODO: Update with actual registry
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # livenessProbe and readinessProbe to be configured in Phase 10
