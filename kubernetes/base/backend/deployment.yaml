# ProductLens AI — Backend Deployment
# Placeholder — will be fully configured in Phase 10
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: productlens
  labels:
    app: productlens
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productlens
      component: backend
  template:
    metadata:
      labels:
        app: productlens
        component: backend
    spec:
      containers:
        - name: backend
          image: productlens/backend:latest  # TODO: Update with actual registry
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # livenessProbe, readinessProbe, env, configMap to be configured in Phase 10
